<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫧✨ 点点</title>
<style>
  :root {
    --primary: #8C7AFF; /* 香芋紫 */
    --primary-light: #F4F1FF;
    --bg: #FDFCF8; /* 奶油米白 */
    --text-main: #4A4A4A;
    --border: #EBE6DF; /* 暖灰边框 */
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); padding-bottom: 40px; line-height: 1.6;}
  
  .app-title { 
    text-align: center; color: var(--primary); font-size: 26px; font-weight: 900;
    margin: 10px 0 25px 0; text-shadow: 2px 2px 4px rgba(140, 122, 255, 0.15); letter-spacing: 2px;
  }
  
  .card { 
    background: #FFFFFF; 
    border-radius: 20px; 
    padding: 25px 20px; 
    margin-bottom: 20px; 
    border: 1px solid var(--border); 
    box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
  }
  
  h3 { margin-top: 0; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; justify-content: space-between;}
  .title-left { display: flex; align-items: center; gap: 8px;}
  
  textarea { 
    width: 100%; height: 120px; border: 2px solid var(--border); border-radius: 12px; 
    padding: 12px; font-size: 14px; outline: none; resize: none; line-height: 1.6; 
    background: #FAFAFA; color: var(--text-main); transition: border-color 0.3s;
  }
  textarea:focus { border-color: var(--primary); background: #FFFFFF; }
  
  /* 按钮统一改成圆润药丸形 */
  .btn { 
    width: 100%; padding: 14px; background: var(--primary); color: white; border: none; 
    border-radius: 50px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; 
    box-shadow: 0 4px 15px rgba(140, 122, 255, 0.2); 
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); 
  }
  .btn:active { transform: scale(0.96); }
  .btn-sm { padding: 10px 15px; font-size: 14px; border-radius: 50px; margin-top: 5px; width: auto;}
  .btn-copy { background: #00B894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.2); }
  
  .btn-clear-text { 
    background: #FFF0F0; color: #FF6B6B; padding: 6px 12px; border-radius: 20px; 
    font-size: 12px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s;
  }
  .btn-clear-text:active { background: #FF6B6B; color: white;}

  #sentenceArea { display: none; max-height: 35vh; overflow-y: auto; background: #FAFAFA; padding: 10px; border-radius: 12px; margin-top: 15px;}
  .sentence-item { 
    margin-bottom: 12px; padding: 12px; background: #FFFFFF; border-radius: 10px; 
    border: 1px solid var(--border); cursor: pointer; line-height: 1.6; font-size: 14px;
    transition: all 0.2s;
  }
  .sentence-item:active { background: var(--primary-light); border-color: var(--primary); }
  .sentence-num { color: var(--primary); font-weight: bold; margin-right: 5px; }
  
  #builderArea { display: none; border: 2px dashed var(--primary); background: var(--primary-light); margin-top: 10px;}
  #currentSentenceText { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border);}
  
  .char-box { 
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 15px; 
    touch-action: none; user-select: none; 
  }

  /* 果冻按键质感调整 */
  .char-btn { 
    padding: 8px 14px; 
    background: #FFFFFF; 
    border: 1px solid var(--primary); 
    border-radius: 8px; 
    font-size: 16px; 
    color: var(--text-main); 
    cursor: pointer; 
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), 
                background-color 0.15s ease, 
                color 0.15s ease, 
                box-shadow 0.15s ease;
    box-shadow: 0 3px 0 #DFD8FF; 
    transform: translateY(0) scale(1);
  }
  .char-btn.selected { 
    background: var(--primary); 
    color: white; 
    font-weight: bold; 
    box-shadow: 0 0px 0 #DFD8FF, 0 4px 10px rgba(140, 122, 255, 0.4); 
    transform: translateY(2px) scale(1.05); 
  }
  .char-punc { font-size: 16px; color: #B0B0B0; padding: 6px 2px; }

  #resultArea { display: none; border-top: 2px dashed var(--border); margin-top: 20px; padding-top: 20px;}
  #resultOutput { 
    height: 150px; border-color: #00B894; background: #F4FCFA; 
    font-weight: bold; font-size: 15px; line-height: 1.8; color: #2D3436; 
  }
</style>
</head>
<body>

<div class="app-title">🫧✨ 点点</div>

<div class="card">
  <h3><span class="title-left"><span>📄</span> 1. 粘贴中文长段文本</span></h3>
  <textarea id="inputText" placeholder="把教材或PPT的长段文字粘贴到这里..."></textarea>
  <button class="btn" onclick="splitSentences()">🔪 切割句子</button>
</div>

<div class="card" id="sentenceCard" style="display:none;">
  <h3><span class="title-left"><span>👉</span> 2. 点击你要找词的句子</span></h3>
  <div id="sentenceArea"></div>
</div>

<div class="card" id="builderArea">
  <h3><span class="title-left"><span>🧩</span> 3. 点击或滑动选词</span></h3>
  <div id="currentSentenceText"></div>
  <div class="char-box" id="charContainer"></div>
  
  <div style="display:flex; gap:10px;">
    <button class="btn btn-sm" style="background:#FFB8B8; flex:1; box-shadow: 0 4px 10px rgba(255, 184, 184, 0.2);" onclick="clearBuilder()">清空重选</button>
    <button class="btn btn-sm" style="background:#00B894; flex:2;" onclick="confirmWord()">✅ 确认拼词</button>
  </div>
</div>

<div class="card" id="resultArea">
  <h3>
    <span class="title-left"><span>📤</span> 4. 提取出的生词</span>
    <button class="btn-clear-text" onclick="clearAllResults()">🗑️ 清空列表</button>
  </h3>
  <textarea id="resultOutput" readonly placeholder="提取的词会在这里自动编号..."></textarea>
  <button class="btn btn-copy" onclick="copyResult()">📋 一键复制</button>
</div>

<script>
let sentences = [];
let currentSelectedChars = [];
let extractedWords = []; 

let isPointerDown = false;
let hasMoved = false;
let startIndex = -1;
let startPoint = { x: 0, y: 0 };
let isRangeSelecting = true; 

// --- 音效引擎 ---
let audioCtx = null;
let lastSoundTime = 0;

function playClickSound() {
  try {
    const now = Date.now();
    if (now - lastSoundTime < 40) return;
    lastSoundTime = now;

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  } catch (e) {
    console.log("Audio not supported");
  }
}
// ---------------

function splitSentences() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) { alert('请先粘贴中文内容哦！'); return; }

  const regex = /[^。！？；\.!\?;\n]+[。！？；\.!\?;\n]?/g;
  sentences = text.match(regex) || [];

  const container = document.getElementById('sentenceArea');
  container.innerHTML = '';

  if (sentences.length === 0) { alert('没找到句子哦！'); return; }

  sentences.forEach((sentence, index) => {
    const trimmed = sentence.trim();
    if (!trimmed) return;

    const div = document.createElement('div');
    div.className = 'sentence-item';
    div.innerHTML = `<span class="sentence-num">${index + 1}.</span>${trimmed}`;
    div.onclick = () => openBuilder(trimmed, index);
    container.appendChild(div);
  });

  document.getElementById('sentenceCard').style.display = 'block';
  document.getElementById('sentenceArea').style.display = 'block';
  document.getElementById('sentenceCard').scrollIntoView({ behavior: 'smooth' });
}

function openBuilder(sentenceText, index) {
  document.getElementById('currentSentenceText').innerText = `第 ${index + 1} 句：${sentenceText}`;
  
  const charContainer = document.getElementById('charContainer');
  charContainer.innerHTML = '';
  currentSelectedChars = [];

  let validIndex = 0;

  for (let i = 0; i < sentenceText.length; i++) {
    const char = sentenceText[i];
    if (char === ' ' || char === '\n') continue;

    const isPunctuation = /[^\u4e00-\u9fa5a-zA-Z0-9]/.test(char);

    if (isPunctuation) {
      const span = document.createElement('span');
      span.className = 'char-punc';
      span.innerText = char;
      charContainer.appendChild(span);
    } else {
      const btn = document.createElement('span');
      btn.className = 'char-btn';
      btn.innerText = char;
      btn.dataset.index = validIndex; 
      validIndex++;
      charContainer.appendChild(btn);
    }
  }

  document.getElementById('builderArea').style.display = 'block';
  document.getElementById('builderArea').scrollIntoView({ behavior: 'smooth' });
}

const charBox = document.getElementById('charContainer');

function handleStart(e) {
  const target = e.target;
  if (target.classList.contains('char-btn')) {
    isPointerDown = true;
    hasMoved = false;
    startIndex = parseInt(target.dataset.index);
    
    if (e.type === 'touchstart') {
      startPoint.x = e.touches[0].clientX;
      startPoint.y = e.touches[0].clientY;
    } else {
      startPoint.x = e.clientX;
      startPoint.y = e.clientY;
    }

    isRangeSelecting = !target.classList.contains('selected');
    
    if (isRangeSelecting) {
      if (!target.classList.contains('selected')) {
        playClickSound(); // 点击音效
      }
      target.classList.add('selected');
      if (!currentSelectedChars.includes(target)) currentSelectedChars.push(target);
    } else {
      target.classList.remove('selected');
      currentSelectedChars = currentSelectedChars.filter(btn => btn !== target);
    }

    if (e.type === 'touchstart') e.preventDefault(); 
  }
}

function handleMove(e) {
  if (!isPointerDown) return;
  
  let clientX, clientY;
  if (e.type === 'touchmove') {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  const dist = Math.hypot(clientX - startPoint.x, clientY - startPoint.y);
  if (dist > 10) {
    hasMoved = true;
  }

  if (hasMoved) {
    if (e.type === 'touchmove') e.preventDefault();

    const element = document.elementFromPoint(clientX, clientY);
    if (element && element.classList.contains('char-btn')) {
      const currentIndex = parseInt(element.dataset.index);
      highlightRange(startIndex, currentIndex, isRangeSelecting);
    }
  }
}

function handleEnd() {
  isPointerDown = false;
}

function highlightRange(start, end, selectMode) {
  const btns = document.querySelectorAll('.char-btn');
  const min = Math.min(start, end);
  const max = Math.max(start, end);
  
  btns.forEach(btn => {
    const idx = parseInt(btn.dataset.index);
    if (idx >= min && idx <= max) {
      if (selectMode) {
        if (!btn.classList.contains('selected')) {
          playClickSound(); // 滑动经过时的音效
        }
        btn.classList.add('selected');
        if (!currentSelectedChars.includes(btn)) currentSelectedChars.push(btn);
      } else {
        btn.classList.remove('selected');
        currentSelectedChars = currentSelectedChars.filter(b => b !== btn);
      }
    }
  });
}

charBox.addEventListener('mousedown', handleStart);
charBox.addEventListener('touchstart', handleStart, {passive: false});
document.addEventListener('mousemove', handleMove);
document.addEventListener('touchmove', handleMove, {passive: false});
document.addEventListener('mouseup', handleEnd);
document.addEventListener('touchend', handleEnd);

function clearBuilder() {
  currentSelectedChars.forEach(btn => btn.classList.remove('selected'));
  currentSelectedChars = [];
}

function confirmWord() {
  if (currentSelectedChars.length === 0) {
    alert('你还没选字呢！');
    return;
  }

  currentSelectedChars.sort((a, b) => parseInt(a.dataset.index) - parseInt(b.dataset.index));
  
  let word = '';
  currentSelectedChars.forEach(btn => word += btn.innerText);

  extractedWords.push(word);
  renderResult();
  clearBuilder(); 
  
  const btn = event.target;
  const originalText = btn.innerText;
  btn.innerText = '已添加！';
  setTimeout(() => btn.innerText = originalText, 800);
}

function renderResult() {
  const resultArea = document.getElementById('resultArea');
  const output = document.getElementById('resultOutput');
  
  if (extractedWords.length > 0) {
    resultArea.style.display = 'block';
    const displayText = extractedWords.map((word, index) => `${index + 1}. ${word}`).join('\n');
    output.value = displayText;
  } else {
    resultArea.style.display = 'none';
    output.value = '';
  }
}

function clearAllResults() {
  if (confirm("确定要清空所有提取的词吗？")) {
    extractedWords = [];
    renderResult();
  }
}

function copyResult() {
  const output = document.getElementById('resultOutput');
  if (!output.value) return;
  output.select();
  output.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    alert(`✅ 复制成功！共 ${extractedWords.length} 个词，快去 WPS 里粘贴吧！`);
  } catch (err) {
    alert('复制失败，请手动长按复制~');
  }
}
</script>
</body>
</html>
