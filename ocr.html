<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪄 选选</title>
<style>
  :root {
    --primary: #8C7AFF; /* 香芋紫 */
    --primary-light: #F4F1FF;
    --bg: #FDFCF8; /* 奶油米白 */
    --text-main: #4A4A4A;
    --border: #EBE6DF; /* 暖灰边框 */
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); padding-bottom: 40px; line-height: 1.6;}
  
  .app-title { 
    text-align: center; color: var(--primary); font-size: 26px; font-weight: 900;
    margin: 10px 0 25px 0; text-shadow: 2px 2px 4px rgba(140, 122, 255, 0.15); letter-spacing: 2px;
  }
  
  .card { 
    background: #FFFFFF; 
    border-radius: 20px; 
    padding: 25px 20px; 
    margin-bottom: 20px; 
    border: 1px solid var(--border); 
    box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
  }
  
  h3 { margin-top: 0; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; justify-content: space-between;}
  .title-left { display: flex; align-items: center; gap: 8px;}
  h4 { color: var(--primary); margin-bottom: 5px; margin-top: 15px; font-size: 14px; font-weight: bold;}
  
  textarea { 
    width: 100%; height: 120px; border: 2px solid var(--border); border-radius: 12px; 
    padding: 12px; font-size: 14px; outline: none; resize: none; line-height: 1.6; 
    background: #FAFAFA; color: var(--text-main); transition: border-color 0.3s;
  }
  textarea:focus { border-color: var(--primary); background: #FFFFFF; }
  
  /* 按钮统一改成圆润药丸形 */
  .btn { 
    width: 100%; padding: 14px; background: var(--primary); color: white; border: none; 
    border-radius: 50px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; 
    box-shadow: 0 4px 15px rgba(140, 122, 255, 0.2); 
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); 
  }
  .btn:active { transform: scale(0.96); }
  .btn-generate { background: #FFB259; box-shadow: 0 4px 15px rgba(255, 178, 89, 0.2); margin-top: 10px;}
  .btn-merge { background: #00B894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.2); margin-top: 10px;}
  .btn-copy { background: var(--primary); box-shadow: 0 4px 15px rgba(140, 122, 255, 0.2); margin-top: 10px;}
  .btn-send { background: #00B894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.2); margin-top: 10px;}
  
  #readingArea { display: none; max-height: 40vh; overflow-y: auto; padding-right: 5px; background: #FAFAFA; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid var(--border);}
  .sentence-row { margin-bottom: 15px; line-height: 2.2; font-size: 15px; }
  .sentence-num { color: var(--primary); font-weight: bold; font-size: 13px; margin-right: 6px; background: var(--primary-light); padding: 3px 8px; border-radius: 8px; }
  
  /* 选词高亮 */
  .clickable-word { cursor: pointer; padding: 2px 4px; border-radius: 6px; transition: all 0.2s; display: inline-block; }
  .clickable-word.selected { background: var(--primary); color: white; font-weight: bold; box-shadow: 0 2px 5px rgba(140, 122, 255, 0.3); }
  
  #resultArea { display: none; border: 2px dashed #00B894; background: #F4FCFA; margin-top: 20px;}
  #resultArea h3 { color: #00B894; }
  
  .result-textarea { 
    border-color: var(--border); 
    background: white;
    white-space: pre-wrap; 
    word-wrap: break-word; 
    word-break: normal;
    height: 80px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 5px;
  }
  .hint { font-size: 12px; color: #999; margin-bottom: 5px; }

  /* 翻译合并专用样式 */
  .merge-container { display: flex; gap: 10px; margin-top: 10px; }
  .merge-box { flex: 1; }
  .merge-box label { font-size: 13px; font-weight: bold; color: var(--text-main); margin-bottom: 5px; display: block;}
</style>
</head>
<body>

<div class="app-title">🪄 选选</div>

<div class="card">
  <h3><span class="title-left"><span>📋</span> 1. 粘贴英文原文到「选选」</span></h3>
  <textarea id="inputText" placeholder="把提取出来的英文阅读理解粘贴到这里..."></textarea>
  <button class="btn" onclick="processText()">🔍 生成语境选词</button>
</div>

<div class="card" id="readingBox" style="display:none;">
  <h3><span class="title-left"><span>👆</span> 2. 在句子里直接点单词</span></h3>
  <div id="readingArea"></div>
  <button class="btn btn-generate" onclick="generateFinal()">✨ 一键生成</button>
</div>

<div class="card" id="resultArea">
  <h3><span>📤</span> 3. 生成结果</h3>
  
  <h4>减号版（复制去翻译）</h4>
  <textarea id="finalOutput" class="result-textarea" readonly></textarea>

  <h4>换行版（备用）</h4>
  <textarea id="newlineOutput" class="result-textarea" readonly></textarea>

  <h4>词频统计</h4>
  <textarea id="freqOutput" class="result-textarea" readonly></textarea>
</div>

<div class="card">
  <h3><span>🔗</span> 4. 翻译合并</h3>
  <div class="hint" style="margin-bottom:10px;">把手机翻译出来的中文，和上方的英文分别粘在下面，点合并！</div>
  
  <div class="merge-container">
    <div class="merge-box">
      <label>英文（减号版）</label>
      <textarea id="mergeEn" placeholder="apple - banana - cat" style="height: 80px;"></textarea>
    </div>
    <div class="merge-box">
      <label>中文（翻译结果）</label>
      <textarea id="mergeCn" placeholder="苹果 - 香蕉 - 猫" style="height: 80px;"></textarea>
    </div>
  </div>

  <button class="btn btn-merge" onclick="mergeTranslations()">🔗 合并生成最终格式</button>

  <div style="margin-top:15px;">
    <h4 style="color:var(--primary);">最终结果（直接去抽卡机）</h4>
    <textarea id="mergeOutput" class="result-textarea" style="border-color:var(--primary); height:100px;" readonly placeholder="这里会生成 apple - 苹果..."></textarea>
    <button class="btn btn-copy" onclick="copyMergeResult()">📋 一键复制最终结果</button>
    
    <!-- 这里就是新增的按钮！ -->
    <button class="btn btn-send" onclick="sendToSmart()">📦 发送到聪明蛋</button>
  </div>
</div>

<script>
let selectedWords = new Set();
let wordFrequency = {};

function processText() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) { alert('请先粘贴文字哦！'); return; }

  wordFrequency = {};
  const allMatches = text.match(/[a-zA-Z]+/g) || [];
  allMatches.forEach(w => {
    const lower = w.toLowerCase();
    wordFrequency[lower] = (wordFrequency[lower] || 0) + 1;
  });

  const rawSentences = text.split(/[\n]+|(?<=[.!?])\s+/);
  const readingArea = document.getElementById('readingArea');
  readingArea.innerHTML = '';
  selectedWords.clear();
  document.getElementById('resultArea').style.display = 'none';

  let sentenceIndex = 1;
  let hasContent = false;

  rawSentences.forEach(sentence => {
    const trimmed = sentence.trim();
    if (trimmed.length === 0 || !/[a-zA-Z]/.test(trimmed)) return;

    hasContent = true;
    const row = document.createElement('div');
    row.className = 'sentence-row';
    
    const numSpan = document.createElement('span');
    numSpan.className = 'sentence-num';
    numSpan.textContent = sentenceIndex + '.';
    row.appendChild(numSpan);

    const tokens = trimmed.match(/[a-zA-Z]+|[^a-zA-Z]+/g) || [];

    tokens.forEach(token => {
      if (/^[a-zA-Z]+$/.test(token)) {
        const wordSpan = document.createElement('span');
        wordSpan.className = 'clickable-word';
        wordSpan.textContent = token;
        const lowerWord = token.toLowerCase();

        if (selectedWords.has(lowerWord)) wordSpan.classList.add('selected');

        wordSpan.onclick = function() {
          if (selectedWords.has(lowerWord)) {
            selectedWords.delete(lowerWord);
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.remove('selected');
            });
          } else {
            selectedWords.add(lowerWord);
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.add('selected');
            });
          }
        };
        row.appendChild(wordSpan);
      } else {
        row.appendChild(document.createTextNode(token));
      }
    });

    readingArea.appendChild(row);
    sentenceIndex++;
  });

  if (!hasContent) { alert('没有识别到英文单词哦！'); return; }

  document.getElementById('readingBox').style.display = 'block';
  document.getElementById('readingArea').style.display = 'block';
  document.getElementById('readingBox').scrollIntoView({ behavior: 'smooth' });
}

function generateFinal() {
  if (selectedWords.size === 0) {
    alert('你还没选单词呢！先在句子里戳几个吧~');
    return;
  }

  const selectedArray = Array.from(selectedWords);
  
  document.getElementById('finalOutput').value = selectedArray.join(' - ');
  document.getElementById('mergeEn').value = selectedArray.join(' - ');
  document.getElementById('newlineOutput').value = selectedArray.join('\n');

  const freqArray = selectedArray.map(word => {
    const count = wordFrequency[word] || 1;
    return `${word}(${count}次)`;
  });
  document.getElementById('freqOutput').value = freqArray.join(' - ');
  
  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';
  resultArea.scrollIntoView({ behavior: 'smooth' });
}

function mergeTranslations() {
  const enStr = document.getElementById('mergeEn').value;
  const cnStr = document.getElementById('mergeCn').value;

  if (!enStr || !cnStr) {
    alert("请把英文和中文都放进去哦！");
    return;
  }

  const enArr = enStr.split(/[-—，,]/).map(s => s.trim()).filter(Boolean);
  const cnArr = cnStr.split(/[-—，,]/).map(s => s.trim()).filter(Boolean);

  let resultLines = [];
  let maxLen = Math.max(enArr.length, cnArr.length);

  for (let i = 0; i < maxLen; i++) {
    let en = enArr[i] || "";
    let cn = cnArr[i] || "";
    if (en || cn) {
      resultLines.push(`${en} - ${cn}`);
    }
  }

  document.getElementById('mergeOutput').value = resultLines.join('\n');
}

function copyMergeResult() {
  const output = document.getElementById('mergeOutput');
  if (!output.value) {
    alert("还没有生成内容哦！");
    return;
  }
  
  output.select();
  output.setSelectionRange(0, 99999);
  
  try {
    document.execCommand('copy');
    alert('✅ 复制成功！快去抽卡机里粘贴吧！');
  } catch (err) {
    alert('复制失败，请手动长按文本框全选复制~');
  }
}

// ================= 新增：发送到聪明蛋 =================
function sendToSmart() {
  const output = document.getElementById('mergeOutput').value;
  if (!output) {
    alert("还没有生成合并结果哦，请先完成翻译合并！");
    return;
  }
  
  // 把 "apple - 苹果" 解析成聪明蛋需要的格式 {ko: "apple", cn: "苹果"}
  const lines = output.split('\n').filter(line => line.trim());
  const words = [];
  lines.forEach(line => {
    const parts = line.split(' - ');
    if (parts.length >= 2) {
      words.push({ ko: parts[0].trim(), cn: parts.slice(1).join(' - ').trim() });
    } else {
      words.push({ ko: line.trim(), cn: '（待补充翻译）' });
    }
  });

  if (words.length === 0) return alert("没有识别到有效格式。");

  // 存入浏览器的“中转站”，固定为中文->英语
  const payload = { target: 'en-US', native: 'zh-CN', words: words };
  localStorage.setItem('smart_pending_words', JSON.stringify(payload));
  
  alert(`✅ 成功打包 ${words.length} 个单词！\n\n请打开「聪明蛋」，确保你选的语言是【中文 ➡️ 英语】，打开后会自动接收！`);
}
</script>
</body>
</html>
