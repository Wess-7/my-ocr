<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生词提取器 - 语境版</title>
<style>
  :root {
    --primary: #6c5ce7;
    --primary-light: #f0edff;
    --bg: #f0f2f5;
    --text-main: #2d3436;
    --text-sub: #636e72;
  }
  * { box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: var(--bg); 
    margin: 0; 
    padding: 15px; 
    color: var(--text-main);
    padding-bottom: 40px;
  }
  .card { 
    background: white; 
    border-radius: 16px; 
    padding: 20px; 
    margin-bottom: 15px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
  }
  h3 { 
    margin-top: 0; 
    font-size: 16px; 
    color: var(--primary); 
    display: flex;
    align-items: center;
    gap: 8px;
  }
  textarea { 
    width: 100%; 
    height: 120px; 
    border: 2px solid #eee; 
    border-radius: 12px; 
    padding: 12px; 
    font-size: 14px; 
    font-family: inherit;
    outline: none; 
    resize: none;
    transition: border-color 0.3s;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--primary); }
  
  .btn { 
    width: 100%; 
    padding: 14px; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 25px; 
    font-size: 16px; 
    font-weight: bold; 
    margin-top: 15px; 
    cursor: pointer; 
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-copy { background: #00b894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
  
  /* 句子阅读区 */
  #readingArea { display: none; max-height: 40vh; overflow-y: auto; padding-right: 5px; }
  .sentence-row { 
    margin-bottom: 12px; 
    line-height: 1.8; 
    font-size: 15px;
    padding: 8px;
    border-radius: 8px;
    background: #fafafa;
  }
  .sentence-num { 
    color: var(--primary); 
    font-weight: bold; 
    font-size: 13px; 
    margin-right: 6px; 
    background: var(--primary-light);
    padding: 2px 6px;
    border-radius: 6px;
    display: inline-block;
  }
  /* 单词点击块 */
  .clickable-word { 
    cursor: pointer; 
    padding: 2px 4px; 
    border-radius: 4px; 
    transition: all 0.2s;
    display: inline-block;
  }
  .clickable-word.selected { 
    background: var(--primary); 
    color: white; 
    font-weight: bold; 
    box-shadow: 0 2px 5px rgba(108, 92, 231, 0.4);
  }

  /* 底部汇总区 */
  #resultArea { display: none; position: sticky; bottom: 0; z-index: 10; border-top: 2px dashed #eee;}
  .hint { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
</style>
</head>
<body>

<div class="card">
  <h3><span>📋</span> 1. 粘贴英文原文</h3>
  <textarea id="inputText" placeholder="把提取出来的英文阅读理解文章粘贴到这里..."></textarea>
  <button class="btn" onclick="processText()">🔍 生成带编号的句子</button>
</div>

<div class="card" id="readingBox" style="display:none;">
  <h3><span>👆</span> 2. 在句子里直接点单词</h3>
  <div class="hint">直接戳你看不懂的单词，戳中变紫</div>
  <div id="readingArea"></div>
</div>

<div class="card" id="resultArea">
  <h3><span>📤</span> 3. 已选生词</h3>
  <textarea id="outputText" readonly style="height: 80px;"></textarea>
  <button class="btn btn-copy" onclick="copyResult()">📋 一键复制</button>
</div>

<script>
// 用 Set 存储选中的词，保证不重复
let selectedWords = new Set();

function processText() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) { alert('请先粘贴文字哦！'); return; }

  // 按换行符和常见标点符号(,.?!;:)切分句子
  // 正则说明：匹配换行符，或者以 .?! 结尾的句子（保留标点）
  const rawSentences = text.match(/[^.!?\n]+[.!?]?/g) || [];
  
  const readingArea = document.getElementById('readingArea');
  readingArea.innerHTML = '';
  selectedWords.clear();
  updateOutput();

  let sentenceIndex = 1;

  rawSentences.forEach(sentence => {
    const trimmed = sentence.trim();
    // 如果句子全是标点或者空格，跳过
    if (trimmed.length < 2 || !/[a-zA-Z]/.test(trimmed)) return;

    // 创建句子容器
    const row = document.createElement('div');
    row.className = 'sentence-row';
    
    // 编号
    const numSpan = document.createElement('span');
    numSpan.className = 'sentence-num';
    numSpan.textContent = sentenceIndex + '.';
    row.appendChild(numSpan);

    // 拆分句子里的单词和非单词部分（保留空格和标点）
    // 用正则捕获英文单词 `[a-zA-Z]+` 或者 其它字符 `[^a-zA-Z]+`
    const tokens = trimmed.match(/[a-zA-Z]+|[^a-zA-Z]+/g) || [];

    tokens.forEach(token => {
      if (/[a-zA-Z]/.test(token)) {
        // 是英文单词
        const wordSpan = document.createElement('span');
        wordSpan.className = 'clickable-word';
        wordSpan.textContent = token;
        const lowerWord = token.toLowerCase();

        // 检查之前是否已经全局选中过这个词（比如同一个词在不同句子出现）
        if (selectedWords.has(lowerWord)) {
          wordSpan.classList.add('selected');
        }

        wordSpan.onclick = function() {
          if (selectedWords.has(lowerWord)) {
            selectedWords.delete(lowerWord);
            // 把所有同款词取消高亮
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.remove('selected');
            });
          } else {
            selectedWords.add(lowerWord);
            // 把所有同款词高亮
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.add('selected');
            });
          }
          updateOutput();
        };
        row.appendChild(wordSpan);
      } else {
        // 是空格、标点、数字，直接用文本节点加进去
        row.appendChild(document.createTextNode(token));
      }
    });

    readingArea.appendChild(row);
    sentenceIndex++;
  });

  document.getElementById('readingBox').style.display = 'block';
  if(sentenceIndex > 1) {
    document.getElementById('readingBox').scrollIntoView({ behavior: 'smooth' });
  }
}

function updateOutput() {
  const resultArea = document.getElementById('resultArea');
  const outputText = document.getElementById('outputText');
  
  if (selectedWords.size === 0) {
    resultArea.style.display = 'none';
    return;
  }

  resultArea.style.display = 'block';
  let lines = [];
  selectedWords.forEach(word => {
    lines.push(`${word} - `);
  });
  outputText.value = lines.join('\n');
}

function copyResult() {
  const outputText = document.getElementById('outputText');
  if (!outputText.value) return;
  
  outputText.select();
  outputText.setSelectionRange(0, 99999);
  
  try {
    document.execCommand('copy');
    alert('✅ 复制成功！快去抽卡机里粘贴吧！');
  } catch (err) {
    alert('复制失败，请手动长按全选复制~');
  }
}
</script>
</body>
</html>
