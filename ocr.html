<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生词提取器</title>
<style>
  :root {
    --primary: #6c5ce7;
    --primary-light: #f0edff;
    --bg: #f0f2f5;
    --text-main: #2d3436;
    --text-sub: #636e72;
  }
  * { box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: var(--bg); 
    margin: 0; 
    padding: 15px; 
    color: var(--text-main);
    padding-bottom: 40px;
  }
  .card { 
    background: white; 
    border-radius: 16px; 
    padding: 20px; 
    margin-bottom: 15px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
  }
  h3 { 
    margin-top: 0; 
    font-size: 16px; 
    color: var(--primary); 
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h3 span { font-size: 20px; }
  textarea { 
    width: 100%; 
    height: 140px; 
    border: 2px solid #eee; 
    border-radius: 12px; 
    padding: 12px; 
    font-size: 14px; 
    font-family: inherit;
    outline: none; 
    resize: none;
    transition: border-color 0.3s;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--primary); }
  .btn { 
    width: 100%; 
    padding: 14px; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 25px; 
    font-size: 16px; 
    font-weight: bold; 
    margin-top: 15px; 
    cursor: pointer; 
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-copy { background: #00b894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
  
  .word-container { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 8px; 
    margin-top: 15px; 
    max-height: 45vh; 
    overflow-y: auto; 
    padding-bottom: 10px;
  }
  .word-chip { 
    display: inline-block; 
    padding: 8px 14px; 
    background: #f8f9fa; 
    color: var(--text-main);
    border: 2px solid #eee;
    border-radius: 20px; 
    font-size: 15px; 
    cursor: pointer; 
    user-select: none; 
    transition: all 0.2s;
  }
  .word-chip.selected { 
    background: var(--primary-light); 
    color: var(--primary); 
    border-color: var(--primary); 
    font-weight: bold; 
    transform: scale(1.05);
  }
  .hint { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
</style>
</head>
<body>

<div class="card">
  <h3><span>📋</span> 1. 粘贴英文原文</h3>
  <div class="hint">将夸克提取出来的文字粘贴到这里</div>
  <textarea id="inputText" placeholder="Paste the text here..."></textarea>
  <button class="btn" onclick="splitWords()">✂️ 拆分单词</button>
</div>

<div class="card" id="wordsBox" style="display:none;">
  <h3><span>👆</span> 2. 点选你要背的词</h3>
  <div class="hint">点一下变成紫色，再点一下取消</div>
  <div class="word-container" id="wordContainer"></div>
</div>

<div class="card" id="resultArea" style="display:none;">
  <h3><span>📤</span> 3. 导出你的生词</h3>
  <textarea id="outputText" readonly></textarea>
  <button class="btn btn-copy" onclick="copyResult()">📋 一键复制</button>
</div>

<script>
let selectedWords = new Set();

function splitWords() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) { alert('请先粘贴文字哦！'); return; }

  // 提取所有纯英文字母组合
  const matches = text.match(/[a-zA-Z]+/g);
  if (!matches) { alert('没有找到英文单词！'); return; }

  // 去重，转小写，过滤太长或太短的
  const uniqueWords = [...new Set(matches.map(w => w.toLowerCase()))];
  const validWords = uniqueWords.filter(w => w.length > 1 && w.length < 20);

  const container = document.getElementById('wordContainer');
  container.innerHTML = '';
  selectedWords.clear();

  validWords.forEach(word => {
    const span = document.createElement('span');
    span.className = 'word-chip';
    span.textContent = word;
    // 绑定点击事件
    span.onclick = function() {
      if (selectedWords.has(word)) {
        selectedWords.delete(word);
        span.classList.remove('selected');
      } else {
        selectedWords.add(word);
        span.classList.add('selected');
      }
      updateOutput();
    };
    container.appendChild(span);
  });

  document.getElementById('wordsBox').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  
  // 如果词太多，自动滚到单词区
  if(validWords.length > 0) {
    document.getElementById('wordsBox').scrollIntoView({ behavior: 'smooth' });
  }
}

function updateOutput() {
  const resultArea = document.getElementById('resultArea');
  const outputText = document.getElementById('outputText');
  
  if (selectedWords.size === 0) {
    resultArea.style.display = 'none';
    return;
  }

  resultArea.style.display = 'block';
  let lines = [];
  selectedWords.forEach(word => {
    // 只输出单词加个减号，后面留给抽卡机去填
    lines.push(`${word} - `);
  });
  outputText.value = lines.join('\n');
}

function copyResult() {
  const outputText = document.getElementById('outputText');
  if (!outputText.value) return;
  
  outputText.select();
  outputText.setSelectionRange(0, 99999); // 手机端兼容
  
  try {
    document.execCommand('copy');
    alert('✅ 复制成功！快去抽卡机里粘贴吧！');
  } catch (err) {
    alert('复制失败，请手动长按全选复制~');
  }
}
</script>
</body>
</html>
