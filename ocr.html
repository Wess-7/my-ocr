<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪄 选选</title>
<style>
  :root {
    --primary: #6c5ce7;
    --primary-light: #f0edff;
    --bg: #f0f2f5;
    --text-main: #2d3436;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text-main); padding-bottom: 40px; }
  .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
  h3 { margin-top: 0; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  textarea { width: 100%; height: 120px; border: 2px solid #eee; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; resize: none; line-height: 1.5; }
  textarea:focus { border-color: var(--primary); }
  .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); transition: transform 0.1s; }
  .btn:active { transform: scale(0.96); }
  .btn-copy { background: #00b894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
  
  #readingArea { display: none; max-height: 45vh; overflow-y: auto; padding-right: 5px; background: #fafafa; border-radius: 8px; padding: 10px;}
  .sentence-row { margin-bottom: 12px; line-height: 2; font-size: 15px; }
  .sentence-num { color: var(--primary); font-weight: bold; font-size: 13px; margin-right: 6px; background: var(--primary-light); padding: 2px 6px; border-radius: 6px; }
  
  /* 点选词块的样式，不再有查询中状态，纯瞬间变色 */
  .clickable-word { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all 0.2s; display: inline-block; }
  .clickable-word.selected { background: var(--primary); color: white; font-weight: bold; }
  
  #resultArea { display: none; position: sticky; bottom: 0; z-index: 10; border-top: 2px dashed #eee;}
</style>
</head>
<body>

<div class="card">
  <h3><span>📋</span> 1. 粘贴英文原文到「选选」 🪄</h3>
  <textarea id="inputText" placeholder="把提取出来的英文阅读理解粘贴到这里..."></textarea>
  <button class="btn" onclick="processText()">🔍 生成语境选词</button>
</div>

<div class="card" id="readingBox" style="display:none;">
  <h3><span>👆</span> 2. 在句子里直接点单词</h3>
  <div id="readingArea"></div>
</div>

<div class="card" id="resultArea">
  <h3><span>📤</span> 3. 选好的生词</h3>
  <textarea id="outputText" style="height: 120px; border-color: #00b894;" placeholder="这里会生成 word - 格式，复制去抽卡机里补中文就好！"></textarea>
  <button class="btn btn-copy" onclick="copyResult()">📋 一键复制</button>
</div>

<script>
let selectedWords = new Set();

function processText() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) { alert('请先粘贴文字哦！'); return; }

  const rawSentences = text.split(/[\n]+|(?<=[.!?])\s+/);
  const readingArea = document.getElementById('readingArea');
  readingArea.innerHTML = '';
  selectedWords.clear();
  updateOutput();

  let sentenceIndex = 1;
  let hasContent = false;

  rawSentences.forEach(sentence => {
    const trimmed = sentence.trim();
    if (trimmed.length === 0 || !/[a-zA-Z]/.test(trimmed)) return;

    hasContent = true;
    const row = document.createElement('div');
    row.className = 'sentence-row';
    
    const numSpan = document.createElement('span');
    numSpan.className = 'sentence-num';
    numSpan.textContent = sentenceIndex + '.';
    row.appendChild(numSpan);

    const tokens = trimmed.match(/[a-zA-Z]+|[^a-zA-Z]+/g) || [];

    tokens.forEach(token => {
      if (/^[a-zA-Z]+$/.test(token)) {
        const wordSpan = document.createElement('span');
        wordSpan.className = 'clickable-word';
        wordSpan.textContent = token;
        const lowerWord = token.toLowerCase();

        if (selectedWords.has(lowerWord)) wordSpan.classList.add('selected');

        wordSpan.onclick = function() {
          if (selectedWords.has(lowerWord)) {
            selectedWords.delete(lowerWord);
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.remove('selected');
            });
          } else {
            selectedWords.add(lowerWord);
            document.querySelectorAll(`.clickable-word`).forEach(el => {
              if (el.textContent.toLowerCase() === lowerWord) el.classList.add('selected');
            });
          }
          updateOutput();
        };
        row.appendChild(wordSpan);
      } else {
        row.appendChild(document.createTextNode(token));
      }
    });

    readingArea.appendChild(row);
    sentenceIndex++;
  });

  if (!hasContent) { alert('没有识别到英文单词哦！'); return; }

  document.getElementById('readingBox').style.display = 'block';
  document.getElementById('readingArea').style.display = 'block';
  document.getElementById('readingBox').scrollIntoView({ behavior: 'smooth' });
}

function updateOutput() {
  const resultArea = document.getElementById('resultArea');
  const outputText = document.getElementById('outputText');
  
  if (selectedWords.size === 0) {
    resultArea.style.display = 'none';
    return;
  }

  resultArea.style.display = 'block';
  let lines = [];
  selectedWords.forEach(word => {
    // 只留短横线，你去抽卡机里自己填
    lines.push(`${word} - `);
  });
  outputText.value = lines.join('\n');
}

function copyResult() {
  const outputText = document.getElementById('outputText');
  if (!outputText.value) return;
  outputText.select();
  outputText.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    alert('✅ 复制成功！去抽卡机填中文吧！');
  } catch (err) {
    alert('复制失败，请手动长按全选复制~');
  }
}
</script>
</body>
</html>
