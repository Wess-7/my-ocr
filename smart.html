<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥚 聪明蛋专属抽卡机</title>
<style>
  /* ================= 基础变量与全局 ================= */
  :root{
    --p:#8C7AFF; /* 香芋紫 */
    --s:#B4A7FF;
    --bg:#FDFCF8; /* 奶油米白 */
    --b:#EBE6DF; /* 暖灰边框 */
    --t:#4A4A4A; 
    --sub:#8E8E8E; 
    --d:#FF6B6B; 
    --sc:#00B894;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;min-height:100vh;color:var(--t);overflow-x:hidden;line-height:1.5;}
  button{padding:12px 25px;font-size:15px;border:none;border-radius:50px;cursor:pointer;transition:all .2s;font-weight:bold;outline:none;}
  button:active{transform:scale(.95);}
  select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:12px;font-size:15px;outline:none;background:#FAFAFA;color:var(--t);font-family:inherit;}
  select:focus,textarea:focus{border-color:var(--p);background:#fff;}
  
  /* ================= 欢迎页 ================= */
  #welcome{position:fixed;inset:0;background:radial-gradient(circle at 20% 25%,rgba(140,122,255,.35),transparent 45%),radial-gradient(circle at 80% 75%,rgba(180,167,255,.35),transparent 45%),linear-gradient(135deg,#fdfbfb 0%,#ebedee 100%);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .5s;}
  .w-box{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:40px 30px;border-radius:24px;border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 30px rgba(0,0,0,.08);width:100%;max-width:380px;text-align:center;}
  .w-box h1{color:var(--p);font-size:28px;margin-bottom:10px;}
  .w-box p{color:var(--sub);font-size:14px;margin-bottom:20px;}
  .w-box label{display:block;font-size:14px;font-weight:bold;margin-bottom:8px;text-align:left;}
  .btn-quick{display:none;width:100%;padding:15px;font-size:16px;border-radius:50px;background:var(--bg);color:var(--p);font-weight:bold;border:2px dashed var(--p);cursor:pointer;margin-bottom:20px;white-space:pre-line;transition:.3s;}
  .divider{display:none;align-items:center;margin:20px 0;color:#aaa;font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--b);}
  .divider::before{margin-right:10px;}.divider::after{margin-left:10px;}
  .btn-enter{width:100%;padding:15px;font-size:18px;border-radius:50px;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;box-shadow:0 6px 20px rgba(140,122,255,.3);margin-top:10px;}
  
  /* ================= 主界面 ================= */
  #main{display:none;flex-direction:column;align-items:center;width:100%;padding:20px 10px;padding-bottom:50px;}
  .title{color:var(--p);font-size:24px;font-weight:800;margin:10px 0 25px;text-shadow:2px 2px 4px rgba(140,122,255,.15);animation:float 3s infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px;width:100%;max-width:400px;}
  .m-btn{padding:10px 2px;font-size:13px;border-radius:50px;border:2px solid var(--p);background:#fff;color:var(--p);cursor:pointer;font-weight:bold;text-align:center;transition:.3s;}
  .m-btn.active{background:var(--p);color:#fff;}
  
  .box{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:20px;border:1px solid var(--b);box-shadow:0 4px 15px rgba(0,0,0,.02);margin-bottom:20px;}
  .box-title{font-size:14px;color:var(--p);margin-bottom:15px;border-bottom:1px dashed var(--b);padding-bottom:10px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;}
  
  /* 按钮颜色 */
  .btn-draw{background:var(--p);color:#fff;box-shadow:0 4px 15px rgba(140,122,255,.3);}
  .btn-sound{background:#fff;color:var(--p);border:2px solid var(--p);}
  .btn-save{background:var(--sc);color:#fff;box-shadow:0 4px 15px rgba(0,184,148,.2);}
  .btn-clear{color:var(--d);font-size:12px;background:#FFF0F0;padding:6px 12px;border-radius:50px;cursor:pointer;font-weight:bold;}
  
  /* 💅 恢复呼吸感的专属词库区 */
  #folder{display:none;width:100%;max-width:400px;margin-bottom:15px;}
  #folder select{margin-bottom:15px;padding:15px;}
  .folder-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px;}
  .folder-btns button{padding:14px 10px;font-size:14px;border-radius:15px;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.05);}
  .btn-add{background:var(--sc);}
  .btn-ren{background:#FDCB6E;color:#333;}
  .btn-del{background:#FF7675;}
  .btn-view,.btn-smart{background:var(--p);grid-column:span 2;}
  .btn-reset{background:#FFF0F0;color:var(--d);border:2px dashed var(--d);width:100%;padding:15px;margin-top:20px;border-radius:15px;font-size:14px;cursor:pointer;font-weight:bold;}
  
  /* ================= 抽卡区 ================= */
  #card-panel{display:flex;flex-direction:column;align-items:center;width:100%;}
  .card-container{width:300px;height:200px;margin-bottom:25px;position:relative;z-index:1;}
  .card{width:100%;height:100%;position:relative;cursor:pointer;transition:transform .2s ease;}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:24px;padding:20px;transition:opacity .35s,transform .35s;}
  .front{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;font-size:20px;font-weight:bold;box-shadow:0 10px 25px rgba(140,122,255,.3);opacity:1;}
  .back{background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.05);border:1px solid var(--b);opacity:0;transform:translateY(10px);pointer-events:none;}
  .card.flipped .front{opacity:0;transform:translateY(-10px);pointer-events:none;}
  .card.flipped .back{opacity:1;transform:translateY(0);pointer-events:auto;}
  .w-display{font-size:36px;font-weight:bold;color:var(--p);margin-bottom:10px;text-align:center;word-break:break-word;}
  .m-display{font-size:20px;color:var(--sub);text-align:center;word-break:break-word;}
  
  .controls{display:flex;gap:15px;margin-bottom:25px;}
  .history-list{list-style:none;max-height:120px;overflow-y:auto;font-size:14px;}
  .history-item{padding:10px 0;border-bottom:1px dashed var(--b);display:flex;justify-content:space-between;}
  .btn-del-item{color:var(--d);cursor:pointer;}
  
  /* 录入框加高 */
  #input-panel textarea { margin-bottom: 15px; padding: 15px; height: 120px; border-radius: 15px; }

  /* ================= 测试区 ================= */
  #test-panel{display:none;width:100%;max-width:400px;flex-direction:column;align-items:center;}
  .chk-group{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;max-height:150px;overflow-y:auto;}
  .chk-item{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:bold;cursor:pointer;}
  .chk-item input{width:18px;height:18px;accent-color:var(--p);}
  .mode-sel{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .mode-sel label{flex:1;text-align:center;padding:12px 10px;border:2px solid var(--b);border-radius:12px;cursor:pointer;font-size:14px;font-weight:bold;min-width:30%;transition:.2s;}
  .mode-sel input{display:none;}
  .mode-sel input:checked+label{border-color:var(--p);background:var(--bg);color:var(--p);}
  
  #quiz-area{display:none;width:100%;}
  .quiz-card{background:#fff;padding:30px 25px;border-radius:20px;border:1px solid var(--b);text-align:center;}
  .quiz-q{font-size:36px;font-weight:bold;color:var(--p);margin-bottom:25px;word-break:break-word;}
  .quiz-input{font-size:20px;text-align:center;margin-bottom:15px;}
  .choice-btn{display:block;width:100%;padding:15px;margin-bottom:10px;background:#FAFAFA;border:2px solid var(--b);border-radius:12px;font-size:16px;font-weight:bold;color:var(--t);text-align:left;cursor:pointer;transition:.2s;}
  .quiz-fb{font-size:18px;font-weight:bold;margin-top:15px;min-height:25px;}
  
  /* ================= 连连看 ================= */
  #match-area{display:none;width:100%;max-width:400px;margin-bottom:15px;}
  .match-row{display:flex;justify-content:space-between;gap:15px;margin-bottom:15px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .match-btn{padding:15px;font-size:16px;font-weight:bold;border-radius:12px;border:2px solid var(--b);background:#fff;color:var(--t);cursor:pointer;transition:.2s;text-align:center;word-break:break-word;}
  .match-btn.sel{border-color:var(--p);background:var(--bg);color:var(--p);transform:scale(1.05);}
  .match-btn.done{opacity:.3;pointer-events:none;background:#E0E0E0;}
  .match-btn.shake{animation:shake .4s;border-color:var(--d);background:#FFF0F0;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  
  /* ================= 结算区 ================= */
  #result-panel{display:none;width:100%;}
  .result-card{background:#fff;padding:30px 25px;border-radius:20px;border:1px solid var(--b);text-align:center;}
  .res-title{font-size:26px;font-weight:bold;color:var(--p);margin-bottom:10px;}
  .res-score{font-size:40px;font-weight:bold;color:var(--sc);margin-bottom:20px;}
  .wrong-list{text-align:left;margin-bottom:20px;max-height:150px;overflow-y:auto;border-top:1px dashed var(--b);padding-top:15px;}
  .wrong-item{font-size:15px;color:var(--d);margin-bottom:10px;border-bottom:1px dashed var(--b);padding-bottom:10px;}
  .wrong-item span{color:var(--sc);font-weight:bold;}
  .btn-save-mistake{background:#FFB259;color:#fff;width:100%;margin-bottom:10px;}
  
  /* ================= 错题本 ================= */
  #mistake-panel{display:none;width:100%;max-width:400px;flex-direction:column;align-items:center;}
  .m-record{background:#fff;padding:20px;border-radius:16px;border:1px solid var(--b);border-left:4px solid var(--p);margin-bottom:15px;width:100%;}
  .m-header{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);border-bottom:1px dashed var(--b);padding-bottom:10px;margin-bottom:15px;}
  .m-mode{font-weight:bold;color:var(--p);background:var(--bg);padding:4px 10px;border-radius:50px;}
  .m-detail{font-size:14px;margin-bottom:10px;line-height:1.6;display:flex;justify-content:space-between;}
  .wrong-ans{color:var(--d);text-decoration:line-through;margin-left:5px;}
  .right-ans{color:var(--sc);font-weight:bold;margin-left:5px;}
  .btn-speak{cursor:pointer;background:var(--bg);border-radius:10px;padding:6px 10px;}
  .error-tag{font-size:11px;color:#fff;background:var(--d);padding:2px 8px;border-radius:50px;margin-left:8px;}
  
  /* ================= 弹窗 ================= */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(4px);}
  .modal{background:#fff;width:90%;max-width:380px;max-height:80vh;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;}
  .m-head{padding:15px 20px;background:var(--p);color:#fff;font-weight:bold;display:flex;justify-content:space-between;}
  .m-body{padding:20px;overflow-y:auto;flex:1;}
  .m-title{font-weight:bold;color:var(--p);margin-bottom:10px;border-bottom:1px dashed var(--b);padding-bottom:8px;}
  .m-tools{display:flex;gap:10px;margin-bottom:10px;align-items:center;font-size:13px;flex-wrap:wrap;}
  .m-tools input{width:60px;padding:5px;text-align:center;}
  .m-tools button{padding:5px 12px;font-size:12px;background:var(--s);color:#fff;border-radius:50px;}
  .m-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-height:250px;overflow-y:auto;background:#FAFAFA;padding:10px;border-radius:12px;border:1px solid var(--b);}
  .m-item{display:flex;align-items:center;gap:10px;font-size:14px;}
  .m-item input{width:16px;height:16px;accent-color:var(--p);}
  
  .smart-box{display:flex;gap:10px;margin-bottom:10px;}
  .smart-box>div{flex:1;}
  .smart-box label{font-size:12px;font-weight:bold;margin-bottom:5px;display:block;}
  .smart-ta{min-height:120px;resize:vertical;}
  .smart-res{border-color:var(--sc);background:#F4FCFA;}
  
  /* ================= Toast ================= */
  #toast{visibility:hidden;min-width:250px;background:rgba(140,122,255,.95);color:#fff;text-align:center;border-radius:50px;padding:16px;position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:bold;opacity:0;transition:.3s;pointer-events:none;}
  #toast.show{visibility:visible;opacity:1;top:45%;}
</style>
</head>
<body>

<!-- 欢迎页 -->
<div id="welcome">
  <div class="w-box">
    <h1>🥚 聪明蛋抽卡机</h1>
    <p>请选择语言，开启专属记忆</p>
    <button class="btn-quick" id="btnQuick" onclick="quickStart()"></button>
    <div class="divider" id="divider">或者重新选择</div>
    <div style="margin-bottom:15px;">
      <label>1. 我是哪国人（我的母语） / What's your native language?</label>
      <select id="nativeSel">
        <option value="zh-CN">中国人 (中文) / Chinese</option><option value="en-US">英国人/美国人 (英语) / English</option>
        <option value="es-ES">西班牙人 (西班牙语) / Spanish</option><option value="hi-IN">印度人 (印地语) / Hindi</option>
        <option value="ar-SA">阿拉伯人 (阿拉伯语) / Arabic</option><option value="pt-BR">巴西/葡萄牙人 (葡萄牙语) / Portuguese</option>
        <option value="ru-RU">俄罗斯人 (俄语) / Russian</option><option value="fr-FR">法国人 (法语) / French</option>
        <option value="de-DE">德国人 (德语) / German</option><option value="ja-JP">日本人 (日语) / Japanese</option>
        <option value="ko-KR">韩国人 (韩语) / Korean</option><option value="th-TH">泰国人 (泰语) / Thai</option>
      </select>
    </div>
    <div style="margin-bottom:15px;">
      <label>2. 我想学哪国语言（目标语） / Which language do you want to learn?</label>
      <select id="targetSel">
        <option value="ko-KR">韩语 / Korean</option><option value="en-US">英语 / English</option>
        <option value="ja-JP">日语 / Japanese</option><option value="fr-FR">法语 / French</option>
        <option value="de-DE">德语 / German</option><option value="es-ES">西班牙语 / Spanish</option>
        <option value="ru-RU">俄语 / Russian</option><option value="it-IT">意大利语 / Italian</option>
        <option value="pt-BR">葡萄牙语 / Portuguese</option><option value="th-TH">泰语 / Thai</option>
        <option value="vi-VN">越南语 / Vietnamese</option><option value="ar-SA">阿拉伯语 / Arabic</option>
      </select>
    </div>
    <button class="btn-enter" onclick="enterApp()">🚀 开启抽卡</button>
  </div>
</div>

<!-- 主界面 -->
<div id="main">
  <div class="title">🥚 聪明蛋专属抽卡机</div>
  <div class="modes">
    <button class="m-btn active" id="mDef" onclick="switchMode('default')">📚 默认词库</button>
    <button class="m-btn" id="mCus" onclick="switchMode('custom')">✍️ 专属词库</button>
    <button class="m-btn" id="mTest" onclick="switchMode('test')">🎯 自我检测</button>
    <button class="m-btn" id="mMis" onclick="switchMode('mistake')">📕 错题本</button>
  </div>

  <div id="folder">
    <select id="groupSel" onchange="changeGroup()"></select>
    <div class="folder-btns">
      <button class="btn-add" onclick="createGroup()">➕ 新建组</button>
      <button class="btn-ren" onclick="renameGroup()">✏️ 改名字</button>
      <button class="btn-del" onclick="deleteGroup()">🗑️ 删此组</button>
      <button class="btn-view" onclick="openWordList()">👁️ 查看单词</button>
      <button class="btn-smart" onclick="openSmartImport()">📋 左右对应拼接</button>
    </div>
    <button class="btn-reset" onclick="resetData()">🧨 清空当前语言的所有数据</button>
  </div>

  <div id="card-panel">
    <div class="card-container">
      <div class="card" id="card" onclick="toggleFlip()">
        <div class="face front">点击或下方按钮<br>开始抽卡</div>
        <div class="face back">
          <div class="w-display" id="wDisp">사과</div>
          <div class="m-display" id="mDisp">苹果</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn-draw" onclick="drawWord()">🎲 随机抽词</button>
      <button class="btn-sound" onclick="speakWord()">🔊 朗读发音</button>
    </div>
    <div class="box">
      <div class="box-title"><span>📜 最近记录</span><span class="btn-clear" onclick="clearHistory()">🗑️ 清空</span></div>
      <ul class="history-list" id="history"></ul>
    </div>
    <div class="box" id="input-panel" style="display:none;">
      <div class="box-title" id="input-title">✍️ 录入新单词</div>
      <textarea id="customInput" style="height:120px;margin-bottom:15px;"></textarea>
      <button class="btn-save" style="width:100%;" onclick="saveWords()">💾 保存到当前组</button>
    </div>
  </div>

  <div id="test-panel">
    <div class="box" id="test-setup">
      <button class="btn-sound" style="width:100%;margin-bottom:20px;border-color:#FFB259;color:#FFB259;" onclick="openReviewModal()">📚 错题复习</button>
      <div class="box-title" style="border:none;padding:0;color:var(--t)">1. 选择检测组</div>
      <div class="chk-group" id="test-groups"></div>
      <div class="box-title" style="border:none;padding:0;color:var(--t)">2. 选择检测模式</div>
      <div class="mode-sel">
        <input type="radio" name="testMode" id="modeTyping" value="typing" checked><label for="modeTyping" id="lblTyping">写母语</label>
        <input type="radio" name="testMode" id="modeChoice" value="choice"><label for="modeChoice" id="lblChoice">选目标语</label>
        <input type="radio" name="testMode" id="modeMatch" value="matching"><label for="modeMatch" id="lblMatch">连连看</label>
      </div>
      <button class="btn-draw" style="width:100%;" onclick="startTest()">🚀 开始自测</button>
    </div>

    <div id="quiz-area">
      <div class="quiz-card">
        <div class="quiz-q" id="qText">사과</div>
        <input type="text" id="qInput" class="quiz-input" placeholder="输入母语意思..." onkeypress="if(event.key==='Enter')submitTyping()">
        <button class="btn-draw" id="btnSubmit" style="width:100%;display:none;" onclick="submitTyping()">提交答案</button>
        <div id="choice-area" style="display:none;"></div>
        <div class="quiz-fb" id="qFeedback"></div>
        <button class="btn-sound" style="margin-top:20px;width:100%;" onclick="speakWord()">🔊 朗读本题</button>
        <button class="btn-sound" style="margin-top:10px;width:100%;" id="btnNext" onclick="nextQuiz()">下一题 ➡️</button>
      </div>
    </div>

    <div id="match-area">
      <div class="match-row">
        <div class="match-col" id="colLeft"></div>
        <div class="match-col" id="colRight"></div>
      </div>
      <button class="btn-draw" style="width:100%;margin-top:15px;" onclick="checkMatchFinish()">✅ 完成结算</button>
    </div>

    <div id="result-panel">
      <div class="result-card">
        <div class="res-title">🎉 本轮完成！</div>
        <div class="res-score" id="scoreText">正确率：80%</div>
        <div class="wrong-list" id="wrongList"></div>
        <button class="btn-save-mistake" id="btnSaveMis" onclick="saveMistake()">📕 将错题加入错题本</button>
        <button class="btn-draw" id="btnNextRound" style="width:100%;margin-bottom:10px;display:none;" onclick="nextMatchRound()">➡️ 继续下一轮（5个）</button>
        <button class="btn-draw" id="btnRestart" style="width:100%;margin-bottom:10px;" onclick="startTest()">🔄 重新测试</button>
        <button class="btn-sound" style="width:100%;" onclick="backToSetup()">⬅️ 返回设置</button>
      </div>
    </div>
  </div>

  <div id="mistake-panel">
    <div style="width:100%;display:flex;justify-content:space-between;margin-bottom:20px;">
      <h2 style="font-size:20px;color:var(--p);">我的错题本</h2>
      <button class="btn-clear" onclick="clearMistakeBook()">🗑️ 清空</button>
    </div>
    <div id="mistake-list" style="width:100%;"></div>
  </div>
</div>

<!-- 错题复习弹窗 -->
<div class="overlay" id="reviewModal">
  <div class="modal">
    <div class="m-head"><span>错题复习：选择单词</span><span style="cursor:pointer;" onclick="closeModal('reviewModal')">✖</span></div>
    <div class="m-body">
      <div class="m-title">错题选择</div>
      <div class="m-tools">
        批量选 <input type="number" id="batchNum" value="10" min="1"> 个

};

/* ================= 欢迎页与初始化 ================= */
window.onload = () => {
  const cfg = getS("lastLangConfig", null);
  if(cfg){
    $('nativeSel').value = cfg.native; $('targetSel').value = cfg.target;
    $('btnQuick').innerText = `👋 上次配置：${cfg.nativeName} ➡️ ${cfg.targetName}\n点击直接进入`;
    $('btnQuick').style.display = 'block'; $('divider').style.display = 'flex';
  }
};
const quickStart = () => {
  const cfg = getS("lastLangConfig", null);
  if(!cfg) return;
  curNative = cfg.native; curTarget = cfg.target; initApp();
};
const enterApp = () => {
  curNative = $('nativeSel').value; curTarget = $('targetSel').value;
  const nSel = $('nativeSel'), tSel = $('targetSel');
  setS("lastLangConfig", {
    native: curNative, target: curTarget,
    nativeName: getLangName(nSel),
    targetName: getLangName(tSel)
  });
  initApp();
};

const initApp = () => {
  curKey = `_${curNative}_${curTarget}`;
  defWords = [];
  for(let k in dict){
    const t = dict[k][curTarget], n = dict[k][curNative];
    if(t && n) defWords.push({ko:t, cn:n});
    else if(n && dict[k]['en-US']) defWords.push({ko:dict[k]['en-US'], cn:n});
  }
  customGroups = getS("myCustomGroups"+curKey, {"默认分组":[]});
  mistakes = getS("myMistakeBook"+curKey, []);
  errCounts = getS("wordErrorCounts"+curKey, {});
  activeGroup = Object.keys(customGroups)[0] || "默认分组";

  const nName = getLangName($('nativeSel')), tName = getLangName($('targetSel'));
  $('lblTyping').innerText = `${tName} ➡️ 写${nName}`;
  $('lblChoice').innerText = `${nName} ➡️ 选${tName}`;
  $('lblMatch').innerText = `🎮 ${tName}/${nName} 连连看`;
  
  const tS = dict["apple"][curTarget]||'目标语', nS = dict["apple"][curNative]||'母语';
  $('customInput').placeholder = `格式：目标语 - 母语\n例如：\n${tS} - ${nS}`;
  $('qInput').placeholder = `输入${nName}意思...`;

  $('welcome').style.opacity='0';
  setTimeout(()=>{ $('welcome').style.display='none'; $('main').style.display='flex'; }, 500);
  renderHistory(); renderGroups(); switchMode('custom');
};

/* ================= 通用逻辑 ================= */
const shuffle = arr => { let c=arr.length, r; while(c!=0){ r=Math.floor(Math.random()*c); c--; [arr[c],arr[r]]=[arr[r],arr[c]]; } return arr; };
const speak = txt => {
  if(!txt || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); speechSynthesis.resume();
  const u = new SpeechSynthesisUtterance(txt); u.lang=curTarget; u.rate=.85; speechSynthesis.speak(u);
};
const playSound = () => {
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type='sine';
    o.frequency.setValueAtTime(800,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+.1);
    g.gain.setValueAtTime(.5,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);
    o.start(); o.stop(audioCtx.currentTime+.1);
  }catch(e){}
};
const resetData = () => {
  if(confirm("⚠️ 核弹警告！\n清空当前语言下所有数据？")){
    localStorage.removeItem("myCustomGroups"+curKey); localStorage.removeItem("myMistakeBook"+curKey); localStorage.removeItem("wordErrorCounts"+curKey);
    customGroups={"默认分组":[]}; mistakes=[]; errCounts={}; activeGroup="默认分组";
    renderGroups(); renderMistakes(); switchMode('custom'); toast("🧨 已清空！");
  }
};

/* ================= 界面切换 ================= */
const switchMode = mode => {
  curMode = mode;
  ['mDef','mCus','mTest','mMis'].forEach(id=>$(id).classList.remove('active'));
  $('card-panel').style.display='none'; $('folder').style.display='none'; $('input-panel').style.display='none';
  $('test-panel').style.display='none'; $('mistake-panel').style.display='none';
  $('test-setup').style.display='block'; $('quiz-area').style.display='none'; $('match-area').style.display='none'; $('result-panel').style.display='none';

  if(mode==='default'){ $('mDef').classList.add('active'); $('card-panel').style.display='flex'; }
  else if(mode==='custom'){ $('mCus').classList.add('active'); $('card-panel').style.display='flex'; $('folder').style.display='block'; $('input-panel').style.display='block'; renderGroups(); }
  else if(mode==='test'){ $('mTest').classList.add('active'); $('test-panel').style.display='flex'; renderTestGroups(); isReviewing=false; }
  else if(mode==='mistake'){ $('mMis').classList.add('active'); $('mistake-panel').style.display='flex'; renderMistakes(); }

  $('card').classList.remove('flipped'); curWord=null; history=[]; renderHistory(); curDeck=[];
};

/* ================= 抽卡与分组 ================= */
const changeGroup = () => { activeGroup = $('groupSel').value; $('input-title').innerText=`✍️ 录入新单词到「${activeGroup}」`; $('card').classList.remove('flipped'); curWord=null; history=[]; renderHistory(); curDeck=[]; };
const renderGroups = () => {
  $('groupSel').innerHTML = '';
  for(let g in customGroups){
    let o=document.createElement('option'); o.value=g; o.innerText=`${g} (${customGroups[g].length}词)`;
    if(g===activeGroup) o.selected=true; $('groupSel').appendChild(o);
  }
  $('input-title').innerText = `✍️ 录入新单词到「${activeGroup}」`;
};
const createGroup = () => {
  let n = prompt("新组名字："); if(!n||!n.trim()) return; n=n.trim();
  if(customGroups[n]) return alert("已存在！"); customGroups[n]=[]; activeGroup=n; setS("myCustomGroups"+curKey, customGroups); renderGroups(); history=[]; renderHistory(); curDeck=[]; toast(`🎉 创建「${n}」`);
};
const renameGroup = () => {
  let n = prompt(`把「${activeGroup}」改成：`); if(!n||!n.trim()) return; n=n.trim();
  if(customGroups[n]) return alert("已存在！"); customGroups[n]=customGroups[activeGroup]; delete customGroups[activeGroup]; activeGroup=n; setS("myCustomGroups"+curKey, customGroups); renderGroups(); toast(`✏️ 已改名`);
};
const deleteGroup = () => {
  if(Object.keys(customGroups).length===1) return alert("至少保留一组！");
  if(confirm(`删掉「${activeGroup}」及所有词？`)){
    delete customGroups[activeGroup]; activeGroup=Object.keys(customGroups)[0]; setS("myCustomGroups"+curKey, customGroups); renderGroups(); $('card').classList.remove('flipped'); curWord=null; history=[]; renderHistory(); curDeck=[]; toast(`🗑️ 已删除`);
  }
};
const drawWord = () => {
  let pool = curMode==='default' ? defWords : customGroups[activeGroup];
  if(!pool||pool.length===0) return alert(curMode==='default' ? "默认词库空了！" : `「${activeGroup}」没词哦！`);
  if(curDeck.length===0){ curDeck=shuffle([...pool]); if(curWord) toast(`🎉 洗牌啦！`); }
  curWord = curDeck.pop();
  $('card').classList.remove('flipped'); void $('card').offsetWidth;
  $('wDisp').innerText = curWord.ko; $('mDisp').innerText = curWord.cn; $('card').classList.add('flipped');
  history.unshift(curWord); if(history.length>5) history.pop(); renderHistory();
};
const toggleFlip = () => { if(curWord) $('card').classList.toggle('flipped'); };
const speakWord = () => {
  let txt = (curMode==='test' && curTestWord) ? curTestWord.ko : (curWord ? curWord.ko : null);
  if(!txt) return alert("先抽个词！"); speak(txt);
};
const renderHistory = () => {
  $('history').innerHTML = '';
  history.forEach((item,i)=>{
    let li = document.createElement('li'); li.className='history-item';
    li.innerHTML = `<div><span>${esc(item.ko)}</span> <span style="color:#888;margin-left:10px;">${esc(item.cn)}</span></div><span class="btn-del-item" onclick="delHistory(${i})">❌</span>`;
    $('history').appendChild(li);
  });
};
const delHistory = i => { history.splice(i,1); renderHistory(); };
const clearHistory = () => { history=[]; renderHistory(); };
const saveWords = () => {
  if(curMode!=='custom') return alert("请切换专属词库！");
  const text = $('customInput').value.trim(); if(!text) return;
  let count=0;
  text.split('\n').forEach(line=>{
    let idx = line.indexOf('-');
    if(idx>0){
      let ko=line.slice(0,idx).trim(), cn=line.slice(idx+1).trim();
      if(ko&&cn){ customGroups[activeGroup].push({ko,cn}); count++; }
    }
  });
  if(count>0){ setS("myCustomGroups"+curKey, customGroups); $('customInput').value=''; renderGroups(); curDeck=[]; toast(`🎉 保存 ${count} 个词！`); }
  else alert("格式不对！用减号隔开。");
};

/* ================= 弹窗 ================= */
const openSmartImport = () => { $('smartT').value=''; $('smartN').value=''; $('smartR').value=''; $('smartCount').innerText=''; $('smartModal').style.display='flex'; };
const doSmartMerge = () => {
  let ts = $('smartT').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let ns = $('smartN').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let len = Math.max(ts.length, ns.length), res=[];
  for(let i=0; i<len; i++) if(ts[i]||ns[i]) res.push(`${ts[i]||''} - ${ns[i]||''}`);
  $('smartR').value = res.join('\n'); $('smartCount').innerText = `成功 ${res.length} 条`;
};
const copySmart = () => {
  if(!$('smartR').value) return;
  $('smartR').select(); document.execCommand('copy'); toast("📋 已复制");
};
const applySmart = () => {
  if(!$('smartR').value) return;
  let t = $('customInput'); t.value = t.value.trim() ? t.value.trim()+'\n'+$('smartR').value : $('smartR').value;
  closeModal('smartModal'); toast("✅ 已填入录入框");
};
const openWordList = () => {
  let words = customGroups[activeGroup]||[];
  $('wordModalTitle').innerText = `「${activeGroup}」 - ${words.length}词`;
  $('wordModalList').innerHTML = words.length===0 ? '<div style="text-align:center;color:#999;">空空的哦~</div>' : '';
  words.forEach((w,i)=>{
    let div = document.createElement('div'); div.className='m-item'; div.style.padding='10px 0'; div.style.borderBottom='1px dashed var(--b)';
    div.innerHTML = `<div><b style="color:var(--p);">${esc(w.ko)}</b> - ${esc(w.cn)}</div><span style="color:var(--d);cursor:pointer;" onclick="delWord(${i})">🗑️</span>`;
    $('wordModalList').appendChild(div);
  });
  $('wordModal').style.display='flex';
};
const delWord = i => {
  if(confirm("确定删除？")){ customGroups[activeGroup].splice(i,1); setS("myCustomGroups"+curKey, customGroups); renderGroups(); openWordList(); curDeck=[]; }
};

/* ================= 测试引擎 ================= */
const renderTestGroups = () => {
  let c = $('test-groups'); c.innerHTML = `<label class="chk-item"><input type="checkbox" value="__default__" checked> 系统默认词库 (${defWords.length}词)</label>`;
  for(let g in customGroups){
    if(customGroups[g].length===0) continue;
    c.innerHTML += `<label class="chk-item"><input type="checkbox" value="${esc(g)}"> ${esc(g)} (${customGroups[g].length}词)</label>`;
  }
};
const startTest = () => {
  if(isReviewing){
    testDeck = shuffle([...reviewPool]); tTotal = testDeck.length;
  } else {
    let cbs = document.querySelectorAll('#test-groups input:checked');
    if(cbs.length===0) return alert("请选一个词库组！");
    testPool = [];
    cbs.forEach(cb => { testPool = testPool.concat(cb.value==='__default__' ? defWords : (customGroups[cb.value]||[])); });
    if(testPool.length===0) return alert("组里没词！");
    testDeck = shuffle([...testPool]); tTotal = testDeck.length;
  }
  
  testMode = document.querySelector('input[name="testMode"]:checked').value;
  tCorrect=0; wrongs=[];
  $('test-setup').style.display='none'; $('result-panel').style.display='none';
  
  if(testMode==='matching'){ $('quiz-area').style.display='none'; $('match-area').style.display='block'; initMatch(); }
  else { $('quiz-area').style.display='block'; $('match-area').style.display='none'; $('btnSaveMis').style.display='none'; nextQuiz(); }
};
const nextQuiz = () => {
  if(testDeck.length===0) return showResult();
  curTestWord = testDeck.pop(); $('qFeedback').innerText=''; $('btnNext').style.display='none';
  
  if(testMode==='typing'){
    $('qText').innerText=curTestWord.ko; $('qInput').value=''; $('qInput').style.display='block'; $('btnSubmit').style.display='block';
    $('choice-area').style.display='none'; $('qInput').disabled=false; $('btnSubmit').disabled=false; $('qInput').focus();
  } else {
    $('qText').innerText=curTestWord.cn; $('qInput').style.display='none'; $('btnSubmit').style.display='none'; $('choice-area').style.display='block';
    let opts = [curTestWord.ko], pool = testPool.filter(w=>w.ko!==curTestWord.ko);
    while(opts.length<4 && pool.length>0){ let r=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; if(!opts.includes(r.ko)) opts.push(r.ko); }
    opts = shuffle(opts); $('choice-area').innerHTML='';
    opts.forEach(o=>{
      let b=document.createElement('button'); b.className='choice-btn'; b.innerText=o; b.onclick=()=>checkChoice(o,curTestWord.ko,b); $('choice-area').appendChild(b);
    });
  }
};
const submitTyping = () => {
  let ans = $('qInput').value.trim(); if(!ans) return;
  let ok = ans.toLowerCase()===curTestWord.cn.toLowerCase() || curTestWord.cn.toLowerCase().includes(ans.toLowerCase());
  $('qFeedback').innerText = ok ? "✅ 正确！" : `❌ 答案：${curTestWord.cn}`;
  $('qFeedback').style.color = ok ? "var(--sc)" : "var(--d)";
  if(ok) tCorrect++; else wrongs.push({ko:curTestWord.ko, cn:curTestWord.cn, userAns:ans});
  $('qInput').disabled=true; $('btnSubmit').disabled=true; $('btnNext').style.display='block';
};
const checkChoice = (sel, cor, btn) => {
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if(sel===cor){ btn.style.background="#F4FCFA"; btn.style.borderColor="var(--sc)"; $('qFeedback').innerText="✅ 正确！"; $('qFeedback').style.color="var(--sc)"; tCorrect++; }
  else {
    btn.style.background="#FFF0F0"; btn.style.borderColor="var(--d)"; $('qFeedback').innerText=`❌ 答案：${cor}`; $('qFeedback').style.color="var(--d)";
    wrongs.push({ko:cor, cn:curTestWord.cn, userAns:sel});
    document.querySelectorAll('.choice-btn').forEach(b=>{ if(b.innerText===cor){ b.style.background="#F4FCFA"; b.style.borderColor="var(--sc)"; } });
  }
  $('btnNext').style.display='block';
};

/* ================= 连连看 ================= */
const initMatch = () => {
  if(testDeck.length===0) return backToSetup();
  matchWrongSet.clear(); let rw = testDeck.splice(0,5); matchRound=rw; matchTotal=rw.length; matchCorrect=0; matchDone=0; wrongs=[];
  let L = shuffle(rw.map((w,i)=>({t:w.ko,id:i}))), R = shuffle(rw.map((w,i)=>({t:w.cn,id:i})));
  $('colLeft').innerHTML=''; $('colRight').innerHTML='';
  L.forEach(i=>{ let b=document.createElement('button'); b.className='match-btn'; b.innerText=i.t; b.dataset.id=i.id; b.dataset.type='left'; b.onclick=()=>matchClick(b); $('colLeft').appendChild(b); });
  R.forEach(i=>{ let b=document.createElement('button'); b.className='match-btn'; b.innerText=i.t; b.dataset.id=i.id; b.dataset.type='right'; b.onclick=()=>matchClick(b); $('colRight').appendChild(b); });
  selLeft=null; selRight=null;
};
const matchClick = btn => {
  if(btn.classList.contains('done')) return;
  if(btn.dataset.type==='left'){ if(selLeft) selLeft.classList.remove('sel'); selLeft=btn; }
  else { if(selRight) selRight.classList.remove('sel'); selRight=btn; }
  btn.classList.add('sel');
  
  if(selLeft && selRight){
    if(selLeft.dataset.id === selRight.dataset.id){
      playSound(); let pid=selLeft.dataset.id;
      selLeft.classList.remove('sel'); selRight.classList.remove('sel'); selLeft.classList.add('done'); selRight.classList.add('done');
      matchDone++; if(!matchWrongSet.has(pid)) matchCorrect++;
      selLeft=null; selRight=null;
      if(matchDone===matchTotal){ setTimeout(()=>{ if(curMode==='test' && testMode==='matching') showResult(); }, 600); }
    } else {
      let l=selLeft, r=selRight; l.classList.add('shake'); r.classList.add('shake'); matchWrongSet.add(l.dataset.id);
      let cw = matchRound[parseInt(l.dataset.id)];
      wrongs.push({ko:cw.ko, cn:cw.cn, userAns:"连连看错误"});
      setTimeout(()=>{ l.classList.remove('shake','sel'); r.classList.remove('shake','sel'); }, 400);
      selLeft=null; selRight=null;
    }
  }
};
const checkMatchFinish = () => {
  document.querySelectorAll('#colLeft .match-btn').forEach(b=>{
    if(!b.classList.contains('done')) wrongs.push({ko:matchRound[parseInt(b.dataset.id)].ko, cn:matchRound[parseInt(b.dataset.id)].cn, userAns:"未完成"});
  });
  showResult();
};

/* ================= 结算与错题本 ================= */
const showResult = () => {
  $('quiz-area').style.display='none'; $('match-area').style.display='none'; $('test-setup').style.display='none'; $('result-panel').style.display='block';
  let isM = testMode==='matching', acc = isM ? Math.round((matchCorrect/matchTotal)*100) : Math.round((tCorrect/tTotal)*100);
  let sc = isM ? matchCorrect : tCorrect, tot = isM ? matchTotal : tTotal;
  $('scoreText').innerText = `${isM?'本轮':''}正确率：${acc}% (${sc}/${tot})`;
  $('btnNextRound').style.display = (isM && testDeck.length>0) ? 'block' : 'none';
  $('btnRestart').style.display = (isM && testDeck.length>0) ? 'none' : 'block';
  
  let wl = $('wrongList'); wl.innerHTML=''; let uniq=[], seen=new Set();
  wrongs.forEach(w=>{ if(!seen.has(w.ko)){ uniq.push(w); seen.add(w.ko); } });
  if(uniq.length===0){ wl.innerHTML='<div style="text-align:center;color:var(--sc);font-weight:bold;padding:20px;">🌟 全对！</div>'; $('btnSaveMis').style.display='none'; }
  else {
    $('btnSaveMis').style.display='block'; $('btnSaveMis').disabled=false; $('btnSaveMis').innerText="📕 错题加入错题本";
    uniq.forEach(w=>{ wl.innerHTML += `<div class="wrong-item">❌ <span>${esc(w.ko)} (${esc(w.cn)})</span></div>`; });
  }
};
const nextMatchRound = () => {
  $('result-panel').style.display='none'; $('match-area').style.display='block'; $('test-setup').style.display='none'; $('quiz-area').style.display='none'; initMatch();
};
const backToSetup = () => {
  isReviewing = false; 
  $('result-panel').style.display='none'; $('test-setup').style.display='block'; $('quiz-area').style.display='none'; $('match-area').style.display='none';
};
const saveMistake = () => {
  if(wrongs.length===0) return;
  let now = new Date(), ts = `${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  let uniq=[], seen=new Set();
  wrongs.forEach(w=>{ if(!seen.has(w.ko)){ uniq.push(w); seen.add(w.ko); errCounts[w.ko]=(errCounts[w.ko]||0)+1; } });
  setS("wordErrorCounts"+curKey, errCounts);
  mistakes.unshift({ id:Date.now(), time:ts, mode:testMode==='matching'?'连连看':(testMode==='typing'?'目标语译母语':'母语译目标语'), wrongs:[...uniq] });
  setS("myMistakeBook"+curKey, mistakes);
  $('btnSaveMis').disabled=true; $('btnSaveMis').innerText="✅ 已加入"; toast("📕 已加入错题本！");
};
const renderMistakes = () => {
  let c = $('mistake-list'); c.innerHTML = '';
  if(mistakes.length===0) return c.innerHTML='<div style="text-align:center;color:#999;padding:30px;">错题本空空的哦~</div>';
  mistakes.forEach(r=>{
    let wHtml = '';
    r.wrongs.forEach(w=>{
      let badge = errCounts[w.ko] ? `<span class="error-tag">错${errCounts[w.ko]}次</span>` : '';
      wHtml += `<div class="m-detail"><div>❌ ${esc(w.ko)} ${badge}<br><span style="color:#888;font-size:13px;">你的答案：</span><span class="wrong-ans">${esc(w.userAns)}</span><br><span style="color:#888;font-size:13px;">正确答案：</span><span class="right-ans">${esc(w.cn)}</span></div><span class="btn-speak" data-word="${esc(w.ko)}">🔊</span></div>`;
    });
    let div = document.createElement('div'); div.className='m-record';
    div.innerHTML = `<div class="m-header"><div><span class="m-mode">${esc(r.mode)}</span><span style="margin-left:10px;">${esc(r.time)}</span></div><span style="color:var(--d);cursor:pointer;" onclick="delMistake(${r.id})">🗑️</span></div><div>${wHtml}</div>`;
    c.appendChild(div);
  });
  c.onclick = e => { let b=e.target.closest('.btn-speak'); if(b) speak(b.dataset.word); };
};
const delMistake = id => { if(confirm("删除记录？")){ mistakes=mistakes.filter(r=>r.id!==id); setS("myMistakeBook"+curKey,mistakes); renderMistakes(); toast("🗑️ 删除成功"); } };
const clearMistakeBook = () => { if(mistakes.length===0) return; if(confirm("清空整个错题本？")){ mistakes=[]; setS("myMistakeBook"+curKey,mistakes); renderMistakes(); toast("🗑️ 已清空"); } };

/* ================= 错题复习专用 ================= */
const openReviewModal = () => {
  reviewPool=[]; let seen = new Set();
  mistakes.forEach(r=>{ r.wrongs.forEach(w=>{ if(!seen.has(w.ko)){ reviewPool.push(w); seen.add(w.ko); } }); });
  let list = $('reviewList');
  list.innerHTML = reviewPool.length===0 ? '<div style="color:#999;font-size:13px;">暂无错题</div>' : '';
  reviewPool.forEach((w,i)=>{ list.innerHTML += `<label class="m-item"><input type="checkbox" class="cb-all" value="${i}"> ${esc(w.ko)} - ${esc(w.cn)}</label>`; });
  $('reviewModal').style.display='flex';
};
const batchSelect = () => {
  let n = parseInt($('batchNum').value)||0, cbs = document.querySelectorAll('.cb-all'), count=0;
  cbs.forEach(cb=>{ if(count<n){ cb.checked=true; count++; } else cb.checked=false; });
};
const selectAll = () => { document.querySelectorAll('.cb-all').forEach(cb=>cb.checked=true); };
const startReview = () => {
  let sel=[], seen=new Set();
  document.querySelectorAll('.cb-all:checked').forEach(cb=>{ let w=reviewPool[cb.value]; if(w && !seen.has(w.ko)){ sel.push(w); seen.add(w.ko); } });
  if(sel.length===0) return alert("请至少勾选一个错题！");
  
  isReviewing = true; 
  testMode = 'matching'; $('modeMatch').checked = true; 
  reviewPool = [...sel];
  
  closeModal('reviewModal');
  $('test-setup').style.display='none'; $('result-panel').style.display='none';
  $('quiz-area').style.display='none'; $('match-area').style.display='block';
  $('btnSaveMis').style.display='none';
  
  testDeck = shuffle([...sel]); tTotal = testDeck.length; tCorrect=0; wrongs=[];
  initMatch();
};
</script>
</body>
</html>
